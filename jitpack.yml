jdk:
  - openjdk17

ndk:
  version: "26.1.10909125"

android:
  components:
    - tools
    - platform-tools
    - build-tools-36.0.0
    - android-36
    - cmake;3.22.1

before_install:
  - apt-get update -y
  - apt-get install -y ninja-build meson nasm pkg-config

install:
  # Build native deps with 16KB page support
  - bash ./build_yuv.sh
  - bash ./build_sharpyuv.sh
  - bash ./build_de265.sh
  - bash ./build_x265.sh
  - bash ./build_aom.sh
  - bash ./build_dav1d.sh
  - bash ./build_heif.sh
  # Publish AAR to local Maven for JitPack
  - ./gradlew :avif-coder:publishReleasePublicationToMavenLocal --no-daemon -xlint -xtest --stacktrace
